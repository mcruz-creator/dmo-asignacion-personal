<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DMO · Asignación de personal</title>
  <meta name="description" content="Prototipo para importar personal, asignar centros y validar el cierre mensual de DMO.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b3044'/%3E%3Cpath d='M9 8h6a8 8 0 0 1 0 16H9zm5 5v6h2a3 3 0 0 0 0-6z' fill='%235fe0cb'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260917">
</head>
<body>
  <section id="login" class="login-page">
    <form id="loginForm" class="login-card">
      <div class="login-brand">DMO</div>
      <h1>Asignación de personal</h1>
      <p>Ingresá con tu correo y contraseña. Si todavía no tenés contraseña, pedísela a RRHH o al administrador.</p>
      <label class="field">Correo electrónico
        <input id="loginEmail" type="email" autocomplete="email" required placeholder="nombre@organizacion.com">
      </label>
      <label class="field">Contraseña
        <input id="loginPassword" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn primary wide" type="submit">Ingresar</button>
      <div id="loginMessage" class="login-message" aria-live="polite"></div>
    </form>
  </section>
  <div id="secureApp" class="layout" hidden>
    <aside>
      <div class="brand">DMO <span>Personal y centros</span></div>
      <nav id="nav" aria-label="Navegación principal"></nav>
      <div class="period"><b>Período seleccionado</b><span id="periodAside">—</span></div>
    </aside>
    <div class="page">
      <header>
        <div><b>Asignación de personal</b><span id="rolePill" class="pill">—</span></div>
        <div class="header-controls">
          <label class="profile">Período <input id="periodFilter" type="month" min="2025-01"></label>
          <span id="signedUser" class="signed-user"></span>
          <button id="myPassword" class="btn">Contraseña</button>
          <button id="logout" class="btn">Salir</button>
        </div>
      </header>
      <main id="app"></main>
    </div>
  </div>
  <dialog id="modal"></dialog>
  <div id="toast" role="status" hidden></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="jszip.min.js"></script>
  <script src="app.js?v=20260917"></script>
</body>
</html>
